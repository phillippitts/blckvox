# Production profile overrides
# Activate with: --spring.profiles.active=production
#
# These are recommended production defaults. Uncomment and adjust as needed.
# All values shown here match the current application.properties defaults.

# Enable watchdog for auto-recovery
# stt.watchdog.enabled=true

# Enable reconciliation for best accuracy
stt.reconciliation.enabled=true
stt.reconciliation.strategy=overlap

# Conservative concurrency limits
stt.concurrency.vosk-max=4
stt.concurrency.whisper-max=2
