plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'checkstyle'  // Clean code enforcement
    id 'jacoco'      // Test coverage reporting
    id 'com.github.spotbugs' version '6.1.7'  // Bytecode-level static analysis
}

group = 'com.phillippitts'
version = '0.0.1-SNAPSHOT'
description = 'blckvox'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    configureEach {
        // Exclude default Logback in favor of Log4j 2
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Logging with Log4j 2 (replaces Logback)
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'com.lmax:disruptor:3.4.4'  // For async logging performance

    // STT engines
    implementation 'net.java.dev.jna:jna:5.13.0'           // Required by Vosk
    implementation 'com.alphacephei:vosk:0.3.38'          // Vosk STT (0.3.45 has native lib issue on macOS)

    // Hotkey support
    implementation 'com.github.kwhat:jnativehook:2.2.2'    // Global hotkeys

    // Utilities
    implementation 'org.json:json:20231013'                // JSON parsing for Vosk

    // Metrics (JMX-based runtime observability)
    implementation 'io.micrometer:micrometer-core'
    implementation 'io.micrometer:micrometer-registry-jmx'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.awaitility:awaitility:4.2.0'   // Async testing
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        // By default, exclude integration tests and tests requiring real binaries/hardware
        // for fast unit test execution in CI
        excludeTags 'integration', 'requiresVoskModel', 'requiresWhisperBinary', 'real-binary'

        // Allow running real-binary tests with: ./gradlew test -Dtest.includeRealBinary=true
        if (System.getProperty('test.includeRealBinary') == 'true') {
            includeTags 'real-binary'
        }
    }
    // Address Mockito warning on Java 21
    jvmArgs '-XX:+EnableDynamicAgentLoading'
}

// Separate task for all integration tests
tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (tagged with @Tag("integration"))'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    shouldRunAfter test
}

// Separate task for Vosk model integration tests
tasks.register('voskIntegrationTest', Test) {
    description = 'Runs Vosk integration tests (requires Vosk model)'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'requiresVoskModel'
    }
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    shouldRunAfter test
}

// Task for tests requiring real binaries/hardware
tasks.register('realBinaryTest', Test) {
    description = 'Runs tests requiring real binaries, models, or hardware (tagged with @RequiresRealBinary)'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'real-binary'
    }
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    shouldRunAfter test
}

// Run both unit and integration tests with ./gradlew check
tasks.named('check') {
    dependsOn integrationTest
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.graphics']
}

checkstyle {
    toolVersion = '10.12.0'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    // Fail build on violations
    maxWarnings = 0
}

spotbugs {
    toolVersion = '4.9.3'
    effort = 'MAX'
    reportLevel = 'MEDIUM'
    excludeFilter = file("${rootDir}/config/spotbugs/exclude-filter.xml")
}

spotbugsMain {
    reports {
        html { required = true }
        xml { required = false }
    }
}

spotbugsTest.enabled = false

jacocoTestReport {
    dependsOn test
    mustRunAfter integrationTest
    executionData.from(
        fileTree(layout.buildDirectory).include("jacoco/*.exec")
    )
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, excludes: [
                // Spring Boot entry point
                '**/BlckvoxApplication.class',
                // JavaFX (requires FX thread / Platform.startup)
                '**/livecaption/LiveCaptionWindow.class',
                '**/livecaption/JavaFxLifecycle.class',
                '**/livecaption/LiveCaptionManager.class',
                // JNI-dependent (Vosk native lib / model loading)
                '**/vosk/VoskSttEngine.class',
                '**/vosk/VoskSttEngine$SegmentAggregation.class',
                '**/vosk/VoskStreamingService.class',
                '**/vosk/VoskModelProvider.class',
                // JNI smoke test in validateVosk() requires real Vosk model
                '**/config/stt/ModelValidationService.class',
                // OS accessibility permissions required
                '**/hotkey/impl/JNativeHookGlobalKeyHook.class',
                // AWT SystemTray (headless CI incompatible)
                '**/tray/SystemTrayManager*.class',
                // OS process creation (requires real binary)
                '**/whisper/DefaultProcessFactory.class',
                // AWT Robot/Clipboard facades (headless CI incompatible)
                '**/fallback/ClipboardTypingAdapter$AwtClipboardFacade.class',
                '**/fallback/RobotTypingAdapter.class',
                '**/fallback/RobotTypingAdapter$AwtRobotFacade.class',
                // Hardware-dependent audio capture (TargetDataLine, AudioSystem, real microphone)
                '**/capture/JavaSoundAudioCaptureService.class',
                '**/capture/JavaSoundAudioCaptureService$*.class',
                // System-dependent (OperatingSystemMXBean CPU/memory varies by JVM/OS)
                '**/util/SystemResourceMonitor.class',
                // 1-arg @Autowired constructor delegates to testable multi-arg constructor
                '**/whisper/WhisperProcessManager.class',
                // Default constructor only
                '**/whisper/ProcessStreamHandler.class',
            ])
        }))
    }
}

// Configure bootRun to disable headless mode (required for Robot/Clipboard APIs)
tasks.named('bootRun') {
    jvmArgs = [
        '-XX:+EnableDynamicAgentLoading',
        '-Djava.awt.headless=false'
    ]
}
