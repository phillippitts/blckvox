name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            java: '21'
          - os: macos-15
            java: '21'
          - os: ubuntu-latest
            java: '21'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle (unit tests + coverage gates)
        run: ./gradlew clean build jacocoTestCoverageVerification -x integrationTest
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          TRAY_ENABLED: false
          LIVE_CAPTION_ENABLED: false

      - name: Upload build artifacts
        if: success() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/libs/*.jar
          retention-days: 30

      - name: Upload quality reports
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            build/reports/jacoco/
            build/reports/checkstyle/
            build/reports/spotbugs/
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.java }}
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

  security-scan:
    name: Security Scan (OWASP + SBOM)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: OWASP Dependency Check
        run: ./gradlew dependencyCheckAnalyze
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Generate SBOM (CycloneDX)
        run: ./gradlew cyclonedxBom
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            build/reports/dependency-check/
            build/reports/sbom/
          retention-days: 90
